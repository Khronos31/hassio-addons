name: denpa
version: "1.28.0.2"
slug: denpa
description: "danything/denpa 1.28.0。PX-Q3U4 は同梱の px4-userland で開く。BS/CS の標準チャンネル一覧を自動登録。EDCB や mirakc と同時に USB は開かない。"
url: https://github.com/danything/denpa
arch:
  - amd64
usb: true
udev: true
init: false
# TS の読み口 (pipe) を 8MB まで広げる。無いと 64KB のまま詰まり、ライブが SLOW_CONSUMER で切れる。
privileged:
  - SYS_RESOURCE
startup: application
boot: manual
timeout: 60
map:
  - type: addon_config
    read_only: false
  - type: media
    read_only: false
# 上流の server.js が HA Ingress の接頭辞にも対応し、WebSocket も受ける。
# /api/hassio_ingress/<token>/ の下で denpa 本体へ直接つなぐ。
ingress: true
ingress_port: 3000
panel_icon: mdi:television-classic
panel_title: denpa
