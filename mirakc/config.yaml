name: mirakc
version: "3.4.88.3"
slug: mirakc
description: "PX-S1UD と px4-userland 対応機種（全16モデル）向け mirakc。ユーザ空間ドライバと検証済み Q3U4 ファームウェアを同梱します。"
url: https://github.com/Khronos31/hassio-addons/tree/main/mirakc
# ⚠️ amd64 でしか動かしていない。recisdb の公式 .deb が amd64 / arm64 だが、
#    HAOS 実機はまだ amd64 だけ。
arch:
  - amd64
init: false
startup: application
boot: auto
timeout: 300
usb: true
udev: true
realtime: true
map:
  - type: addon_config
    read_only: false
ports:
  40772/tcp: 40772
ports_description:
  40772/tcp: "mirakc の HTTP API（認証なし）"
watchdog: http://[HOST]:[PORT:40772]/api/version
# 設定は config.yml を直接編集。schema の深さ制限に tuner/channel の入れ子は収まらない。
