name: EPGStation
version: "0.1.7"
slug: epgstation
description: "日本の地上デジタル放送の録画管理。チューナーは別のマシンの mirakc / Mirakurun が持ち、こちらは番組表・予約・録画・視聴を担当する。"
url: https://github.com/Khronos31/hassio-addons/tree/main/epgstation
# ⚠️ amd64 でしか動かしていない。上流のイメージは arm64 も持っているが、未確認なので書かない。
arch:
  - amd64
init: false
startup: application
boot: manual
# 録画物は /media に置き、Home Assistant のメディアブラウザからも見えるようにする。
map:
  - media:rw
  - share:rw
# 自分の ingress パスを Supervisor から引くために要る。
hassio_api: true
# ⚠️ LAN へ無認証で開く。EPGStation 自身にログイン機構は無い。
#    Android TV のクライアントなど、ingress を使えないものから繋ぐために要る。
#    要らなければ構成タブで空欄にすれば閉じられる。
ports:
  8888/tcp: 8888
ports_description:
  8888/tcp: "EPGStation の Web UI と API（認証なし）"
ingress: true
ingress_port: 8888
panel_icon: mdi:television-classic
options:
  mirakurun_url: ""
  recorded_path: "/media/EPGStation"
schema:
  mirakurun_url: str?
  recorded_path: str
