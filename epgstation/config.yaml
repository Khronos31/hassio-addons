name: EPGStation
version: "0.1.8"
slug: epgstation
description: "Mirakurun を使用した録画管理ソフト EPGStation。チューナーを持つ mirakc / Mirakurun が別に要ります。"
url: https://github.com/Khronos31/hassio-addons/tree/main/epgstation
# ⚠️ amd64 でしか動かしていない。上流のイメージは arm64 も持っているが、未確認なので書かない。
arch:
  - amd64
init: false
startup: application
boot: manual
# 録画物は /media に置き、Home Assistant のメディアブラウザからも見えるようにする。
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
  # EPGStation の config.yml をここに置く。ホスト側は
  # /addon_configs/<リポジトリID>_epgstation/ に出て、ユーザーが直接編集できる。
  - type: addon_config
    read_only: false
# 自分の ingress パスを Supervisor から引くために要る。
hassio_api: true
# ⚠️ LAN へ無認証で開く。EPGStation 自身にログイン機構は無い。
#    Android TV のクライアントなど、ingress を使えないものから繋ぐために要る。
#    要らなければ構成タブで空欄にすれば閉じられる。
ports:
  8888/tcp: 8888
ports_description:
  8888/tcp: "EPGStation の Web UI と API（認証なし）"
ingress: true
ingress_port: 8888
panel_icon: mdi:television-classic
# 設定項目は置かない。EPGStation の設定は深さ6まで入れ子になっており、アドオンの
# schema が扱える上限（深さ2）に収まらない。config.yml を直接編集してもらう。
